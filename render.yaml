# Render Blueprint — provisions the MALSCAN backend + Postgres in one shot.
# Dashboard: New + → Blueprint → pick this repo. Docs: https://render.com/docs/blueprint-spec
#
# Notes:
# - rootDir is backend/ so uvicorn runs with cwd=backend/ (the app's relative
#   paths — .env loading, app/vault, sys.path for analysis_engine/ — assume it).
# - The build installs ALL THREE requirements files: jinja2 / python-whois /
#   dnspython / defusedxml are runtime deps listed only in the sub-folders.
# - Playwright's Chromium is deliberately NOT installed here — it is large and
#   needs more RAM to run than the free tier has. PDF export instead drives a
#   rented browser over the network (BROWSERLESS_WS_URL below); with that unset
#   it returns a clean 501 and everything else works.
# - API keys (VT_API_KEY, URLSCAN_API_KEY, ABUSEIPDB_API_KEY, ABUSECH_AUTH_KEY)
#   are optional and set manually in the dashboard — never committed.

services:
  - type: web
    name: malscan-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt -r analysis_engine/requirements.txt -r attribution_module/requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      # Pin the interpreter. Render's default moved to Python 3.14, which has no
      # manylinux wheel for psycopg2-binary or yara-python — so pip installed
      # neither, the build still "succeeded", and the service died at startup on
      # `ModuleNotFoundError: No module named 'psycopg2'`. YARA would have failed
      # the same way, silently: no rules, no error, scans that detect nothing.
      #
      # 3.13 has wheels for every dependency and matches local development.
      # Duplicated in .python-version at the repo root; keep them in step.
      - key: PYTHON_VERSION
        value: "3.13.4"
      - key: MALSCAN_DB_URL
        fromDatabase:
          name: malscan-db
          property: connectionString
      # APK WebView origin (Capacitor serves from https://localhost). Add your
      # hosted-web domain here only if the site ever calls the API cross-origin
      # (with the Next.js /api rewrite proxy it does not need CORS).
      - key: MALSCAN_ALLOWED_ORIGINS
        value: https://localhost
      # Headless Chromium for PDF export, rented over the network instead of run
      # on this instance (see the note at the top of this file). Set it in the
      # dashboard — it carries a token, so it is never committed:
      #   wss://production-sfo.browserless.io/chromium?token=YOUR_TOKEN
      # This matters most for the Android app: the WebView cannot produce the
      # PDF itself, so with no browser reachable, phone users get a 501 and no
      # export at all. Leaving it unset is a supported (degraded) state.
      - key: BROWSERLESS_WS_URL
        sync: false
      # Set the enrichment API keys in the Render dashboard (Environment tab):
      #   VT_API_KEY, URLSCAN_API_KEY, ABUSEIPDB_API_KEY, ABUSECH_AUTH_KEY
      # Country URLScan browses from (default "us"). Unset, URLScan picks the
      # exit node itself and geolocalised sites render in a different language
      # each run. Must be one of GET /api/v1/availableCountries/.
      - key: URLSCAN_COUNTRY
        value: us

databases:
  - name: malscan-db
    plan: free
